name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ComfySdk.sln

      - name: Build
        run: dotnet build ComfySdk.sln -c Release --no-restore

      - name: Run Runtime Unit Tests
        run: dotnet run --project tests/ComfySdk.Tests/ComfySdk.Tests.csproj -c Release --no-build

      - name: Run Smoke Tests
        run: dotnet run --project tests/ComfySdk.SmokeTests/ComfySdk.SmokeTests.csproj -c Release --no-build

      - name: Pack Runtime SDK
        run: dotnet pack src/ComfySdk/ComfySdk.csproj -c Release --no-build -o artifacts/nuget

      - name: Pack Generator Tool
        run: dotnet pack src/ComfySdk.Generator/ComfySdk.Generator.csproj -c Release --no-build -o artifacts/nuget

      - name: Upload NuGet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget
